[project]
name = "agent-eval"
version = "0.1.0"
description = "Trace-driven, model- and framework-agnostic evaluation framework for agentic AI systems"
readme = "README.md"
license = {text = "MIT-0"}
requires-python = ">=3.10"
authors = [
    {name = "Amazon Web Services"}
]

dependencies = [
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "jsonpath-ng>=1.6.0,<2.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "litellm>=1.40.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "altair>=5.3.0,<6.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35.0,<2.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_eval*"]
